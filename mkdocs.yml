site_name: Random Notes
site_url: https://vaidzelevich.github.io
theme:
  name: material
  favicon: ./favicon.svg
  logo: ./logo.svg
  features:
    - content.code.copy

plugins:
  - blog:
      blog_dir: .

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
